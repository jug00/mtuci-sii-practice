<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analyse Luggage</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    #imageWrapper {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1rem;
    }
    #imageWrapper img {
      max-width: 48%;
      border-radius: 0.5rem;
    }
    #historyTable {
      max-height: 300px;
      overflow: auto;
    }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="card mx-auto p-4" style="max-width: 800px;">
    <h2 class="text-center mb-4">Подсчёт багажа на ленте</h2>

    <form id="uploadForm" enctype="multipart/form-data" class="d-grid gap-3">
      <div class="mb-3">
        <label for="fileInput" class="form-label">Выберите изображение</label>
        <input
                type="file"
                id="fileInput"
                name="file"
                accept="image/*"
                class="form-control"
                required
        />
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Отправить</button>
      <div class="progress d-none" id="uploadProgress">
        <div
                class="progress-bar progress-bar-striped progress-bar-animated"
                role="progressbar"
                style="width: 0%"
        ></div>
      </div>
    </form>

    <div id="result" class="mt-4 text-center"></div>

    <div id="imageWrapper">
      <img id="originalImg" src="" alt="Исходное изображение" class="img-fluid d-none" />
      <img id="annotatedImg" src="" alt="Результат нейронки" class="img-fluid d-none" />
    </div>

    <hr class="my-4">

    <div class="d-flex justify-content-between align-items-center">
      <button id="showHistoryBtn" class="btn btn-secondary">Показать историю запросов</button>
      <a href="/api/v1/analyse/history/report" class="btn btn-outline-success">Скачать Excel-отчет</a>
    </div>

    <div id="historySection" class="mt-3 d-none">
      <h5>История запросов</h5>
      <div id="historyTable" class="table-responsive">
        <table class="table table-striped mb-0">
          <thead>
          <tr>
            <th>#</th>
            <th>Время</th>
            <th>Количество чемоданов</th>
            <th>Время выполнения в мс</th>
          </tr>
          </thead>
          <tbody id="historyBody">
          <!-- записи истории появятся здесь -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const form            = document.getElementById('uploadForm');
  const fileInput       = document.getElementById('fileInput');
  const resultDiv       = document.getElementById('result');
  const progress        = document.getElementById('uploadProgress');
  const progressBar     = progress.querySelector('.progress-bar');
  const originalImg     = document.getElementById('originalImg');
  const annotatedImg    = document.getElementById('annotatedImg');
  const showHistoryBtn  = document.getElementById('showHistoryBtn');
  const historySection  = document.getElementById('historySection');
  const historyBody     = document.getElementById('historyBody');

  let historyInterval = null;

  // Функция загрузки и отображения истории
  async function loadHistory() {
    historyBody.innerHTML = '<tr><td colspan="5">Загрузка...</td></tr>';
    try {
      const resp = await fetch('/api/v1/analyse/history');
      const data = await resp.json();
      historyBody.innerHTML = '';
      if (!data.length) {
        historyBody.innerHTML = '<tr><td colspan="5">Запросов ещё нет</td></tr>';
      } else {
        data.forEach((rec) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
              <td>${rec.id}</td>
              <td>${new Date(rec.timestamp).toLocaleString()}</td>
              <td>${rec.count}</td>
              <td>${rec.time_elapsed.toFixed(2)}</td>
            `;
          historyBody.append(tr);
        });
      }
    } catch {
      historyBody.innerHTML = '<tr><td colspan="5" class="text-danger">Ошибка загрузки</td></tr>';
    }
  }

  // Показ/скрытие истории и автообновление
  showHistoryBtn.addEventListener('click', () => {
    if (historySection.classList.contains('d-none')) {
      historySection.classList.remove('d-none');
      loadHistory();
      historyInterval = setInterval(loadHistory, 30000);
    } else {
      historySection.classList.add('d-none');
      clearInterval(historyInterval);
      historyInterval = null;
    }
  });

  // Предпросмотр исходного изображения
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      originalImg.src = e.target.result;
      originalImg.classList.remove('d-none');
      annotatedImg.classList.add('d-none');
      resultDiv.innerHTML = '';
    };
    reader.readAsDataURL(file);
  });

  // Отправка формы и отрисовка результата
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!fileInput.files[0]) return;

    progress.classList.remove('d-none');
    progressBar.style.width = '0%';
    resultDiv.innerHTML = '';
    annotatedImg.classList.add('d-none');

    const data = new FormData(form);
    try {
      const resp = await fetch('/api/v1/analyse/predict-image', { method: 'POST', body: data });
      progressBar.style.width = '50%';

      const json = await resp.json();
      progressBar.style.width = '100%';

      resultDiv.innerHTML = `
          <div class="alert alert-success" role="alert">
            Найдено чемоданов: <strong>${json.count}</strong><br/>
            Время обработки: <strong>${json.time_elapsed.toFixed(2)} ms</strong>
          </div>
        `;

      annotatedImg.src = json.processed_image;
      annotatedImg.classList.remove('d-none');

      // Автообновление истории после получения ответа
      if (!historySection.classList.contains('d-none')) {
        loadHistory();
      }
    } catch (err) {
      resultDiv.innerHTML = `
          <div class="alert alert-danger" role="alert">
            Ошибка: ${err.message || err}
          </div>
        `;
    } finally {
      setTimeout(() => progress.classList.add('d-none'), 1000);
    }
  });
</script>
</body>
</html>
